<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        color: #1d2226;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 14px;
        color: #0a66c2;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .row label {
        font-size: 13px;
        color: #1d2226;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #ccc;
        border-radius: 22px;
        transition: 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: 0.15s;
      }
      input:checked + .slider {
        background-color: #0a66c2;
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
      hr {
        border: none;
        border-top: 1px solid #e8e8e8;
        margin: 12px 0;
      }
      .donate {
        display: block;
        margin-top: 4px;
        padding: 7px 0;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: #0a66c2;
        text-decoration: none;
        border: 1px solid #0a66c2;
        border-radius: 6px;
        transition: background 0.15s, color 0.15s;
      }
      .donate:hover {
        background: #0a66c2;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>LinkedIn Noise Reducer</h1>

    <div class="row">
      <label>Hide Promoted Posts</label>
      <label class="switch">
        <input type="checkbox" id="hidePromoted" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label>Hide Job Updates &amp; Anniversaries</label>
      <label class="switch">
        <input type="checkbox" id="hideAnniversaries" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label>Hide "People You May Know"</label>
      <label class="switch">
        <input type="checkbox" id="hidePeopleYouMayKnow" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <label>Hide Suggested &amp; Recommended Posts</label>
      <label class="switch">
        <input type="checkbox" id="hideSuggested" />
        <span class="slider"></span>
      </label>
    </div>

    <hr />
    <a class="donate" href="https://venmo.com/code?user_id=2141469804593152899&created=1788491555" target="_blank">&#9749; Buy me a coffee</a>

    <script src="popup.js"></script>
  </body>
</html>
